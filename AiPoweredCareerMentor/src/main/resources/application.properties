spring.application.name=${APP_NAME:AiPoweredCareerMentor}
server.port=${SERVER_PORT:2030}

# === CORS / Frontend Configuration ===
frontend.url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8081}


# === Spring AI Configuration ===
# Using Google Gemini via OpenAI-Compatible Endpoint
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=${GEMINI_BASE_URL}
spring.ai.openai.chat.options.model=${GEMINI_CHAT_MODEL}
spring.ai.openai.chat.completions-path=${GEMINI_CHAT_COMPLETIONS_PATH}
spring.ai.openai.embeddings-path=${GEMINI_EMBEDDINGS_PATH}
spring.ai.openai.embedding.options.model=${GEMINI_EMBEDDING_MODEL}

# === Datasource ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQL8Dialect}

# === Twilio ===
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

# === RSS Monitoring Configuration ===
rss.monitoring.interval=${RSS_MONITORING_INTERVAL:300000}
rss.monitoring.initial-delay=${RSS_MONITORING_INITIAL_DELAY:60000}
rss.monitoring.bootstrap-enabled=${RSS_MONITORING_BOOTSTRAP_ENABLED:true}

# === News API Configuration ===
news.api.key=${NEWS_API_KEY}
